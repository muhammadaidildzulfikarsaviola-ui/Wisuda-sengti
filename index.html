<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <div class="floating-decoration decoration-1">✦</div>
    <div class="floating-decoration decoration-2">♡</div>
    <div class="floating-decoration decoration-3">✧</div>
    <div class="floating-decoration decoration-4">♡</div>

    <main class="login-container">

        <div class="graduation-icon">
            🎓
        </div>

        <p class="small-label">A LITTLE SOMETHING FOR YOU</p>

        <h1>
            For My<br>
            <span>Favorite Person</span>
        </h1>

        <p class="login-description">
            Ada sesuatu yang pengen gue kasih ke lo.
            Tapi sebelum itu, buktiin dulu kalau lo memang orangnya. ♡
        </p>

        <div class="login-card">

            <label for="dateInput">
                Kapan kita mulai jadi kita?
            </label>

            <input
                type="date"
                id="dateInput"
                autocomplete="off"
            >

            <button id="loginButton">
                Buka Surat
                <span>♡</span>
            </button>

            <p id="loginMessage" class="login-message"></p>

        </div>

        <div class="locked-info">
            <span>🔒</span>
            Surat ini baru bisa dibuka pada
            <strong>6 Oktober 2026 · 12:00</strong>
        </div>

        <div id="countdown" class="countdown">
            <div>
                <strong id="days">00</strong>
                <span>hari</span>
            </div>

            <div>
                <strong id="hours">00</strong>
                <span>jam</span>
            </div>

            <div>
                <strong id="minutes">00</strong>
                <span>menit</span>
            </div>

            <div>
                <strong id="seconds">00</strong>
                <span>detik</span>
            </div>
        </div>

        <footer>
            made with love ♡
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
